<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#4fb0e8" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#64e4d6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#05080d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#05080d"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- neural cluster -->
  <g stroke="#64e4d6" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="980" y1="130" x2="1080" y2="210"/>
    <line x1="1080" y1="210" x2="1010" y2="330"/>
    <line x1="1010" y1="330" x2="900" y2="300"/>
    <line x1="900" y1="300" x2="980" y2="130"/>
    <line x1="1080" y1="210" x2="1160" y2="150"/>
    <line x1="1010" y1="330" x2="1120" y2="420"/>
    <line x1="900" y1="300" x2="850" y2="430"/>
  </g>
  <g fill="#9decdf">
    <circle cx="980" cy="130" r="6"/>
    <circle cx="1080" cy="210" r="8"/>
    <circle cx="1010" cy="330" r="7"/>
    <circle cx="900" cy="300" r="5"/>
    <circle cx="1160" cy="150" r="4"/>
    <circle cx="1120" cy="420" r="6"/>
    <circle cx="850" cy="430" r="4"/>
  </g>

  <!-- wordmark -->
  <text x="90" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#e9f1f7">Lina</text>
  <circle cx="188" cy="86" r="5" fill="#64e4d6"/>

  <!-- eyebrow -->
  <text x="92" y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="5" fill="#64e4d6">AI CONCIERGE · СКОРО</text>

  <!-- headline -->
  <text x="88" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#e9f1f7">Выгрузите голову.</text>
  <text x="88" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#e9f1f7">Дальше — <tspan font-style="italic" fill="#64e4d6">Lina</tspan>.</text>

  <!-- sub -->
  <text x="90" y="546" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#869cad">Личный консьерж в одном чате — записи, брони, письма, поиск.</text>
</svg>
