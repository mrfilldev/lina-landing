<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lina</title>
<meta name="robots" content="noindex" />
<meta name="description" content="Lina — AI concierge. Early access." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/favicon-180.png" />
<style>
  html, body { height: 100%; margin: 0; background: #05080d; color: #869cad;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; padding: 24px; }
  .mark { font-family: Georgia, "Times New Roman", serif; font-size: 1.6rem; color: #e9f1f7; letter-spacing: .01em; }
  .dots { display: inline-flex; gap: 6px; justify-content: center; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #64e4d6; opacity: .3; animation: p 1.2s ease-in-out infinite; }
  .dots i:nth-child(2){ animation-delay: .15s } .dots i:nth-child(3){ animation-delay: .3s }
  @keyframes p { 0%,100%{ opacity:.25; transform: translateY(0) } 50%{ opacity:1; transform: translateY(-3px) } }
  a { color: #64e4d6; }
  @media (prefers-reduced-motion: reduce){ .dots i { animation: none; opacity: .6 } }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">Lina</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <noscript>
      <p>Choose a version: <a href="/midnight/">Midnight</a> · <a href="/daylight/">Daylight</a></p>
    </noscript>
  </div>

<script>
(function () {
  var VARIANTS = ["midnight", "daylight"];
  var KEY = "lina_variant";

  var qs = new URLSearchParams(location.search);
  var forced = (qs.get("v") || "").toLowerCase();
  var variant = null;

  if (VARIANTS.indexOf(forced) !== -1) {
    variant = forced;
  } else {
    try { var saved = localStorage.getItem(KEY); } catch (e) {}
    if (VARIANTS.indexOf(saved) !== -1) {
      variant = saved;
    } else {
      variant = VARIANTS[Math.random() < 0.5 ? 0 : 1];
    }
  }

  try { localStorage.setItem(KEY, variant); } catch (e) {}

  // Preserve everything except our own routing param (?v=)
  qs.delete("v");
  var tail = qs.toString();
  var dest = "/" + variant + "/" + (tail ? "?" + tail : "");

  // Analytics hook — wire later (see README). Fires before navigation.
  try {
    (window.dataLayer = window.dataLayer || []).push({
      event: "ab_assign", variant: variant, forced: forced === variant
    });
  } catch (e) {}

  location.replace(dest);
})();
</script>
</body>
</html>
